name: etapa-experimental

x-app: &app
  build: .
  image: etapa-experimental-app:latest
  environment:
    DATABASE_URL: postgresql://app:app@postgres:5432/pedidos
    DB_POOL_SIZE: "10"
  deploy:
    resources:
      limits: { cpus: "1.0", memory: 512M }
  depends_on:
    postgres: { condition: service_healthy }

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: pedidos }
    volumes: ["./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro"]
    deploy: { resources: { limits: { cpus: "2.0", memory: 1G } } }
    healthcheck:
      {
        test: ["CMD-SHELL", "pg_isready -U app -d pedidos"],
        interval: 2s,
        retries: 30,
      }

  rest-entrada:
    <<: *app
    profiles: [rest]
    command: ["node", "dist/rest/entrada.js"]
    environment:
      PROCESSING_URL: http://rest-processamento:3001/orders
  rest-processamento:
    <<: *app
    profiles: [rest]
    command: ["node", "dist/rest/processamento.js"]

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    profiles: [mq]
    volumes: ["./db/rabbitmq.conf:/etc/rabbitmq/conf.d/90-local.conf:ro"]
    deploy: { resources: { limits: { cpus: "2.0", memory: 1G } } }
    healthcheck:
      {
        test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"],
        interval: 3s,
        retries: 40,
      }
  mq-entrada:
    <<: *app
    profiles: [mq]
    command: ["node", "dist/mq/entrada.js"]
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
    depends_on: { rabbitmq: { condition: service_healthy } }
  mq-processamento:
    <<: *app
    profiles: [mq]
    command: ["node", "dist/mq/processamento.js"]
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
      DATABASE_URL: postgresql://app:app@postgres:5432/pedidos
      DB_POOL_SIZE: "10"
      PREFETCH: "10"
    depends_on:
      rabbitmq: { condition: service_healthy }
      postgres: { condition: service_healthy }
